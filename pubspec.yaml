name: screenshot_detect
description: Native screenshot detection for iOS and Android 14+ with broadcast streams and callbacks.
version: 2.0.0
homepage: https://github.com/glebosotov/flutter-screenshot-callback

environment:
    sdk: ^3.8.1
    flutter: ">=3.44.0"

dependencies:
    flutter:
        sdk: flutter
    flutter_plugin_android_lifecycle: ^2.0.35
    meta: ^1.19.0

dev_dependencies:
    flutter_lints: ^6.0.0
    pigeon: 29.0.6

flutter:
    plugin:
        platforms:
            ios:
                pluginClass: ScreenshotDetectPlugin
            android:
                package: dev.glebosotov.screenshot_detect
                pluginClass: ScreenshotDetectPlugin
