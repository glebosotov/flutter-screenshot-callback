name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check generated bridge
        run: |
          dart run pigeon --input pigeon_config.dart
          dart format lib/screenshot_detect.g.dart
          git diff --exit-code -- lib/screenshot_detect.g.dart android/src/main/kotlin/dev/glebosotov/screenshot_detect/Messages.g.kt ios/screenshot_detect/Sources/screenshot_detect/Messages.g.swift
      - run: dart format --output=none --set-exit-if-changed lib test pigeon_config.dart example/lib example/test
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example
      - run: ./gradlew :screenshot_detect:testDebugUnitTest
        working-directory: example/android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: example
